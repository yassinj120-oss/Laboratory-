
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check project files
        run: |
          test -f index.html
          echo "Project files:"
          ls -la

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.aljuman.lab",
            "appName": "Al-Juman Side Lab",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Prepare website files
        run: |
          mkdir -p www

          rsync -av ./ www/ \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude="android" \
            --exclude="www" \
            --exclude="dist" \
            --exclude="build" \
            --exclude="package.json" \
            --exclude="package-lock.json" \
            --exclude="capacitor.config.json"

          echo "Files copied to www:"
          ls -la www

          test -f www/index.html

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Juman-Side-Lab-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
