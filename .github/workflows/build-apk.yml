
name: Build Al-Juman Side Lab APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Application
    runs-on: ubuntu-latest

    steps:
      # 1. Download project
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install Java for Android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4. Verify files
      - name: Check project files
        run: |
          set -e
          echo "Checking project files..."

          test -f index.html || {
            echo "ERROR: index.html is missing"
            exit 1
          }

          test -f package.json || {
            echo "ERROR: package.json is missing"
            exit 1
          }

          echo "Project files found."

      # 5. Install dependencies
      - name: Install dependencies
        run: npm install

      # 6. Prepare application files
      - name: Prepare web application
        run: |
          set -e

          mkdir -p www
          cp index.html www/index.html

          if [ -f app.js ]; then
            cp app.js www/app.js
          fi

          if [ -f style.css ]; then
            cp style.css www/style.css
          fi

          if [ -f manifest.json ]; then
            cp manifest.json www/manifest.json
          fi

          if [ -f service-worker.js ]; then
            cp service-worker.js www/service-worker.js
          fi

          if [ -f lab_form.jpg ]; then
            cp lab_form.jpg www/lab_form.jpg
            echo "JPG report template copied."
          elif [ -f lab_form.png ]; then
            cp lab_form.png www/lab_form.png
            echo "PNG report template copied."
          else
            echo "No external template found."
            echo "Continuing without external template check."
          fi

          echo "Web application prepared."

      # 7. Check Capacitor configuration
      - name: Check Capacitor configuration
        run: |
          set -e

          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.js ] && [ ! -f capacitor.config.ts ]; then
            echo "ERROR: Capacitor configuration file is missing."
            exit 1
          fi

          echo "Capacitor configuration found."

      # 8. Add Android platform
      - name: Add Android platform
        run: |
          set -e

          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android platform already exists."
          fi

      # 9. Sync application
      - name: Sync Capacitor Android
        run: |
          set -e
          npx cap sync android

      # 10. Verify Android project
      - name: Verify Android project
        run: |
          set -e
          test -f android/gradlew
          test -d android/app
          echo "Android project verified."

      # 11. Build APK
      - name: Build Debug APK
        run: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 12. Verify APK
      - name: Verify APK file
        run: |
          set -e

          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK file was not generated."
            exit 1
          fi

          echo "APK successfully generated."
          ls -lh "$APK_PATH"

      # 13. Upload APK
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Juman-Side-Lab-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
