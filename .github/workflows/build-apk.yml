name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check project files
        run: |
          echo "Checking project files..."
          ls -la
          test -f index.html
          test -f package.json
          test -f capacitor.config.json
          echo "Required files found."

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor Android
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Android project
        run: |
          npx cap add android || true

      - name: Copy web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp style.css www/style.css
          cp -r app.js www/ 2>/dev/null || true
          cp -r database.js www/ 2>/dev/null || true
          cp -r patients.js www/ 2>/dev/null || true
          cp -r reports.js www/ 2>/dev/null || true
          cp -r tests.js www/ 2>/dev/null || true
          cp -r settings.js www/ 2>/dev/null || true
          cp -r statistics.js www/ 2>/dev/null || true
          cp -r backup.js www/ 2>/dev/null || true
          cp -r manifest.json www/ 2>/dev/null || true
          cp -r service-worker.js www/ 2>/dev/null || true

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.aljuman.lab",
            "appName": "Al-Juman Laboratory",
            "webDir": "www"
          }
          EOF

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Juman-Laboratory-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
