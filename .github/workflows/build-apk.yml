
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check project files
        run: |
          set -e

          test -f index.html

          echo "Repository files:"
          find . -maxdepth 3 -type f \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            | sort

      - name: Check report template
        run: |
          set -e

          TEMPLATE="قالب تقرير مختبر الجمان الطبي.png"

          if [ -f "$TEMPLATE" ]; then
            echo "Report template found:"
            ls -lh "$TEMPLATE"
          else
            echo "::error::Report template not found: $TEMPLATE"
            echo "Please upload the report template PNG to the repository root."
            echo "Files currently available:"
            find . -maxdepth 3 -type f \
              -not -path "./.git/*" \
              -not -path "./node_modules/*"
            exit 1
          fi

      - name: Install dependencies
        run: |
          set -e
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.aljuman.lab",
            "appName": "Al-Juman Side Lab",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Prepare website files
        run: |
          set -e

          rm -rf www
          mkdir -p www

          rsync -av ./ www/ \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude="android" \
            --exclude="www" \
            --exclude="dist" \
            --exclude="build" \
            --exclude="package.json" \
            --exclude="package-lock.json" \
            --exclude="capacitor.config.json"

          echo "Files copied to www:"
          find www -maxdepth 3 -type f | sort

          test -f www/index.html
          test -f "www/قالب تقرير مختبر الجمان الطبي.png"

      - name: Verify report template in www
        run: |
          set -e

          TEMPLATE="www/قالب تقرير مختبر الجمان الطبي.png"

          test -f "$TEMPLATE"

          echo "Template size:"
          du -h "$TEMPLATE"

          file "$TEMPLATE"

      - name: Add Android platform
        run: |
          set -e

          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android
        run: |
          set -e
          npx cap sync android

      - name: Verify Android assets
        run: |
          set -e

          echo "Checking Android web assets..."

          find android/app/src/main/assets -maxdepth 4 -type f | sort

          test -f android/app/src/main/assets/public/index.html

          echo "Android assets synchronized successfully."

      - name: Build APK
        run: |
          set -e

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Juman-Side-Lab-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
