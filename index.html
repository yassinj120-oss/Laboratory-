<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مختبر الجمان الجانبي</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,"Noto Sans Arabic",sans-serif;
 background:#f3f6fa;
 color:#172335
}
button,input,select,textarea{font:inherit}
button{
 border:0;border-radius:9px;padding:11px 15px;
 background:#1769aa;color:white;cursor:pointer
}
button:hover{opacity:.9}
.secondary{background:#e8f0f8;color:#12345a}
.danger{background:#ffe5e5;color:#b42318}
header{
 background:#12345a;color:white;padding:18px;
 display:flex;justify-content:space-between;
 align-items:center;flex-wrap:wrap;gap:12px
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
 width:55px;height:55px;border-radius:12px;
 overflow:hidden;background:white
}
.logo img{width:100%;height:100%;object-fit:contain}
header h1{margin:0;font-size:21px}
header small{display:block;margin-top:5px;color:#d1dfed}
.layout{display:flex;min-height:calc(100vh - 90px)}
.sidebar{
 width:230px;background:white;border-left:1px solid #ddd;
 padding:15px;flex-shrink:0
}
.sidebar button{
 width:100%;text-align:right;margin-bottom:8px;
 background:#eaf1f8;color:#12345a
}
.sidebar button.active{background:#12345a;color:white}
main{flex:1;padding:22px;min-width:0}
.page{display:none}
.page.active{display:block}
.title{font-size:25px;margin:0 0 20px}
.cards{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
 gap:14px
}
.card,.panel{
 background:white;border:1px solid #dce4ee;
 border-radius:14px;padding:17px
}
.panel{margin-top:16px}
.metric{font-size:32px;color:#1769aa;font-weight:bold;margin-top:8px}
.grid{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
 gap:13px
}
.field label{display:block;font-weight:bold;margin-bottom:6px}
.field input,.field select,.field textarea{
 width:100%;padding:11px;border:1px solid #dce4ee;
 border-radius:8px;background:white
}
.field textarea{min-height:80px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.table-wrap{overflow:auto;border:1px solid #dce4ee;border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:650px;background:white}
th,td{padding:11px;text-align:right;border-bottom:1px solid #e2e8f0}
th{background:#eaf1f8;color:#12345a}
.search{
 width:100%;max-width:400px;padding:11px;
 border:1px solid #dce4ee;border-radius:8px;margin-bottom:12px
}
.empty{text-align:center;padding:25px;color:#64748b}
.badge{padding:5px 9px;border-radius:20px;background:#eaf1f8}
footer{text-align:center;padding:18px;color:#64748b}
@media(max-width:700px){
 .layout{display:block}
 .sidebar{width:100%;display:grid;grid-template-columns:repeat(3,1fr)}
 .sidebar button{font-size:13px;text-align:center;padding:10px 5px}
 main{padding:12px}
 header h1{font-size:17px}
 .title{font-size:21px}
}
</style>
</head>
