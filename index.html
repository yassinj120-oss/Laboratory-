<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102d4f">
<title>مختبر الجمان الجانبي</title>
<style>
:root{--navy:#102d4f;--blue:#1c6ca8;--light:#eaf2fa;--bg:#f4f7fb;--text:#1c2938;--muted:#718096;--border:#e1e8f0;--white:#fff;--green:#16845b;--red:#c0392b;--shadow:0 8px 25px rgba(16,45,79,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans Arabic",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 15px;background:var(--blue);color:white;font-weight:600;transition:.15s}button:hover{filter:brightness(.96)}button:active{transform:scale(.98)}.btn-light{background:var(--light);color:var(--navy)}.btn-danger{background:#feeceb;color:var(--red)}.btn-green{background:var(--green)}.app{min-height:100vh;display:flex}.sidebar{width:245px;background:var(--navy);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:16px;flex-shrink:0}.brand{display:flex;gap:11px;align-items:center;padding:6px 8px 18px;border-bottom:1px solid #ffffff22}.logo{height:48px;width:48px;border-radius:15px;background:#eaf2fa;color:var(--navy);display:grid;place-items:center;font-size:25px;font-weight:bold}.brand h1{font-size:16px;margin:0 0 5px}.brand small{font-size:11px;color:#c7d8e9}.nav{display:grid;gap:5px}.nav button{background:transparent;text-align:right;color:#d9e5f1;padding:12px 14px;border-radius:10px;display:flex;gap:10px;align-items:center}.nav button.active,.nav button:hover{background:#ffffff16;color:#fff}.nav .ico{width:22px;text-align:center;font-size:17px}.side-footer{margin-top:auto;font-size:12px;color:#b9c9d9;text-align:center;padding:12px}.main{min-width:0;flex:1}.topbar{background:#fff;border-bottom:1px solid var(--border);padding:15px 25px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.topbar h2{font-size:19px;margin:0}.topbar .date{font-size:13px;color:var(--muted)}.content{max-width:1450px;margin:auto;padding:24px}.page{display:none}.page.active{display:block}.page-title{margin:0 0 20px;font-size:24px}.welcome{background:linear-gradient(120deg,#102d4f,#1c6ca8);color:white;border-radius:18px;padding:24px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.welcome h2{margin:0 0 7px;font-size:22px}.welcome p{margin:0;color:#d9e7f5}.welcome button{background:white;color:var(--navy)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.stat{background:#fff;border:1px solid var(--border);border-radius:15px;padding:18px;box-shadow:var(--shadow)}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px}.stat-icon{height:40px;width:40px;border-radius:12px;background:var(--light);display:grid;place-items:center;font-size:20px}.stat-num{font-size:30px;font-weight:bold;color:var(--navy);margin-top:13px}.panel{background:#fff;border:1px solid var(--border);border-radius:15px;padding:20px;margin-top:18px;box-shadow:var(--shadow)}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:15px}.panel-head h3{margin:0;font-size:17px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.quick button{padding:17px;background:var(--light);color:var(--navy);text-align:center}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);background:#fff;border-radius:9px;padding:11px;color:var(--text);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1c6ca818}.field textarea{min-height:85px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.search{width:100%;max-width:440px;border:1px solid var(--border);padding:11px 13px;border-radius:10px;margin-bottom:14px}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:650px;background:white}th,td{text-align:right;padding:12px;border-bottom:1px solid var(--border);white-space:nowrap}th{background:#f0f5fa;color:var(--navy);font-size:13px}tbody tr:hover{background:#fafcff}.empty{text-align:center;color:var(--muted);padding:25px}.badge{display:inline-block;padding:4px 9px;border-radius:20px;background:#e9f3ff;color:#1c6ca8;font-size:12px}.test-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;max-height:430px;overflow:auto}.test-option{border:1px solid var(--border);padding:12px;border-radius:10px;display:flex;gap:9px;align-items:center;cursor:pointer;background:#fff}.test-option.selected{border-color:var(--blue);background:#eef6ff}.test-option input{accent-color:var(--blue)}.test-option small{color:var(--muted);display:block;margin-top:4px}.result-input{min-width:110px}.report-head{border-bottom:2px solid var(--navy);padding-bottom:12px;margin-bottom:14px}.report-head h2{margin:0;color:var(--navy)}.report-head small{color:var(--muted)}.patient-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0;padding:13px;background:#f7f9fc;border-radius:10px}.meta-item{font-size:13px}.meta-item b{display:block;margin-bottom:3px}.modal-back{position:fixed;inset:0;background:#07162999;display:none;align-items:center;justify-content:center;padding:15px;z-index:100}.modal-back.show{display:flex}.modal{width:min(600px,100%);background:#fff;border-radius:16px;padding:22px;max-height:90vh;overflow:auto}.modal h3{margin-top:0}.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}footer{text-align:center;color:var(--muted);padding:22px;font-size:12px}.mobile-menu{display:none}
@media(max-width:1000px){.sidebar{width:205px}.cards{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.app{display:block}.sidebar{width:auto;padding:10px;position:sticky;top:0;z-index:10}.brand{padding:5px;border:0}.brand h1{font-size:15px}.brand small{font-size:10px}.nav{display:flex;overflow:auto;gap:5px}.nav button{white-space:nowrap;padding:9px 10px;font-size:12px}.side-footer{display:none}.topbar{padding:12px 15px}.content{padding:14px}.cards{grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:13px}.stat-num{font-size:25px}.welcome{padding:18px}.welcome h2{font-size:18px}.form-grid{grid-template-columns:1fr}.quick{grid-template-columns:1fr}.test-list{grid-template-columns:1fr}.patient-meta{grid-template-columns:1fr 1fr}.page-title{font-size:21px}}
@media print{body{background:white}.sidebar,.topbar,.content>.page:not(#reportPage),#reportPage .actions,.no-print,footer{display:none!important}.app,.main,.content{display:block;padding:0;margin:0}.page.active{display:block!important}.panel{box-shadow:none;border:0;padding:0}.report-head{text-align:center}.patient-meta{background:white;border:1px solid #bbb}.table-wrap{border:0}table{min-width:0}th,td{border:1px solid #888;padding:8px}th{background:#eee!important;color:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
